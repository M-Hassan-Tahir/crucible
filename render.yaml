# Render Blueprint — Crucible API (FastAPI)
# Apply: Render Dashboard → New → Blueprint → connect this GitHub repo.
# After deploy, open Environment and fill any variables marked "sync: false" if prompted.
# Docs: https://render.com/docs/blueprint-spec
#
services:
  - type: web
    name: crucible-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b:free
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
